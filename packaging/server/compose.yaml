# A team server (surface item 31, NEW-surface-4, SUR-42; models rule 26a,
# NEW-models-15). See docs/reference/INSTALL.md. Replace every <...> before
# starting.
#
# One inference engine per filled role of the shipped set (models rule 3):
# Coding, Planning (Seshat shares it) and Research. The Review role is
# unfilled until a model is admitted for it (RG-P8-13), so it has no service.
# Each engine's `command` is exactly that shipped profile's launchArgs()
# (`teamEngines()`, apps/harness/src/team_engines.ts; a static test holds
# them equal), with the weights at /models and the host-sized values
# computed for a 64 GB host: every service keeps its role resident, which
# rule 22 allows only on a host that fits them all. The engines join the
# harness's network namespace, so the harness reaches each on loopback at
# the port and model path its profile expects (MD-M4-1).
#
# Images are pinned by digest (MD-N15-4). The engines use llama.cpp's CUDA
# build (NVIDIA); INSTALL names the Vulkan and CPU images to use instead.
services:
  # The harness. It owns the network namespace the engines join.
  sekhemet:
    build:
      context: ../..
      dockerfile: packaging/server/Dockerfile
    environment:
      # The engines' saved slots, shared so erased ones are swept (MD-N14-37).
      SEKHEMET_SLOT_CACHE: /slots
      SEKHEMET_MODELS_DIR: /models
    # bubblewrap needs unprivileged user namespaces inside the container.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    volumes:
      - <repository>:/work
      - sekhemet-user:/home/node/.sekhemet
      - <models folder>:/models:ro
      - sekhemet-slots:/slots

  # Coding: nail-mtp (models rule 3). About 16.9 GB of GPU memory.
  engine-coding:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10818@sha256:e61f29b37c471f956a772f91f4e9952d29f237e5d1a1a748e14421aae090305f
    network_mode: "service:sekhemet"
    depends_on: [sekhemet]
    command: ["-m", "/models/Nail-Qwen3.6-35B-A3B-MTP-UD-IQ3_XXS.gguf", "--host", "127.0.0.1", "--port", "8098", "-ngl", "99", "-fa", "on", "--jinja", "-c", "16384", "-ctk", "q8_0", "-ctv", "q8_0", "-np", "1", "--cache-ram", "4096", "--ctx-checkpoints", "8", "--slot-save-path", "/slots"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8098/health"]
    volumes:
      - <models folder>:/models:ro
      - sekhemet-slots:/slots
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Planning, and Seshat: Qwen3.8-27B GSQ-RCO. About 14.3 GB of GPU memory.
  engine-planning:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10818@sha256:e61f29b37c471f956a772f91f4e9952d29f237e5d1a1a748e14421aae090305f
    network_mode: "service:sekhemet"
    depends_on: [sekhemet]
    command: ["-m", "/models/Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf", "--host", "127.0.0.1", "--port", "8099", "-ngl", "99", "-fa", "on", "--jinja", "-c", "8192", "-ctk", "q8_0", "-ctv", "q8_0", "-np", "1", "--cache-ram", "4096", "--ctx-checkpoints", "8", "--slot-save-path", "/slots"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8099/health"]
    volumes:
      - <models folder>:/models:ro
      - sekhemet-slots:/slots
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Research: Apodex-1.1-mini, two slots. About 22.1 GB of GPU memory.
  engine-research:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10818@sha256:e61f29b37c471f956a772f91f4e9952d29f237e5d1a1a748e14421aae090305f
    network_mode: "service:sekhemet"
    depends_on: [sekhemet]
    command: ["-m", "/models/Apodex-1.1-mini-IQ3_M.gguf", "--host", "127.0.0.1", "--port", "8101", "-ngl", "99", "-fa", "on", "--jinja", "-c", "65536", "-ctk", "q8_0", "-ctv", "q8_0", "-np", "2", "--cache-ram", "4096", "--ctx-checkpoints", "8", "-sps", "0.5", "--slot-save-path", "/slots"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8101/health"]
    volumes:
      - <models folder>:/models:ro
      - sekhemet-slots:/slots
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # The identity-aware proxy: terminates TLS with your certificate, signs
  # people in, and passes their email in X-Forwarded-Email. The harness
  # trusts that header only from the addresses in [identity] trusted_proxies
  # (integrations item 24). Only its HTTPS listener is published; its plain
  # HTTP listener stays on the container's loopback (the default address).
  identity-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
    command:
      - --https-address=0.0.0.0:4443
      - --tls-cert-file=/tls/tls.crt
      - --tls-key-file=/tls/tls.key
      - --upstream=http://sekhemet:4040
      - --email-domain=<your domain>
      - --provider=oidc
      - --oidc-issuer-url=<issuer>
      - --pass-user-headers=true
      - --set-xauthrequest=true
    environment:
      OAUTH2_PROXY_CLIENT_ID: <client id>
      OAUTH2_PROXY_CLIENT_SECRET: <client secret>
      OAUTH2_PROXY_COOKIE_SECRET: <32 random bytes, base64>
    volumes:
      # tls.crt (the full chain) and tls.key for the server's host name.
      - <TLS certificate folder>:/tls:ro
    ports:
      - "443:4443"

volumes:
  sekhemet-user:
  sekhemet-slots:
