# Generated by the Sekhemet fixture generator (X21).
[project]
protected = ["tests/**", ".sekhemet/gates.toml"]
max_files = 3
max_diff_lines = 200

[[gate]]
id = "parse"
rung = "parse"
layer = "static"
command = "python3"
args = ["-B", "-c", "import ast, pathlib; [ast.parse(p.read_text(), str(p)) for p in pathlib.Path('.').rglob('*.py')]"]
timeout_s = 120
parser = "generic"

[[gate]]
id = "unit"
rung = "test"
layer = "functional"
command = "python3"
args = ["-B", "-m", "unittest", "discover", "-s", "tests", "-t", "."]
timeout_s = 120
parser = "generic"
