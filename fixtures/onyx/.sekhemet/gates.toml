# Onyx release-gate verification. Every card is verified against all three
# blocking gates, exactly as Project Chronicle is.

[project]
protected = ["tests/**", "acceptance/**", ".sekhemet/gates.toml"]
max_files = 3
max_diff_lines = 200
# Formatting is applied by the harness to scope files only, never to tests.
autofix = ["pnpm", "exec", "biome", "check", "--write"]
# Stylistic rules whose fixes Biome marks unsafe but which cannot change
# behaviour. Applied to scope files only, like the formatter.
style_fix = ["pnpm", "exec", "biome", "lint", "--write", "--unsafe"]
style_fix_rules = ["style/noUnusedTemplateLiteral", "style/useTemplate", "complexity/useLiteralKeys", "style/noUselessElse"]

[[gate]]
id = "typecheck"
rung = "typecheck"
layer = "static"
command = "pnpm"
args = ["typecheck"]
timeout_s = 180
parser = "tsc"

[[gate]]
id = "lint"
rung = "lint"
layer = "static"
command = "pnpm"
args = ["lint"]
timeout_s = 120
parser = "biome"

[[gate]]
id = "unit"
rung = "test"
layer = "functional"
command = "pnpm"
args = ["test"]
timeout_s = 300
parser = "vitest"
